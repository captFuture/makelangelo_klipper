# =============================================================================
# polardrawing -- printer.cfg for Polar Drawing Machine with biqu Skr Pico board
# Project: https://github.com/captFuture/makelangelo_klipper
#
# Based on the Project Makelangelo polargraph drawing machine design:
# https://www.makelangelo.com/polargraph/
# Changed to a more modern Hardware Plattform 
#
# Hardware:
#   - BTT SKR Pico V1.0 Control Board
#   - Raspberry Pi or  as host (or BIGTREETECH Pi 2 / Pi 2 Lite)
#   - 2x NEMA17, 200 steps/rev, GT2 belt, 20-tooth drive pulleys (pancake works as well)
#   - 2x counterweight with idler pulley + MAX endstop
#   - 1x servo for pen up/down
#
# FILE PLACEMENT on Raspberry Pi / Pi2 / Pi2 Lite:
#   ~/printer_data/config/printer.cfg
#
#[include macros.cfg] (if macros at the bottom of this file are put to a seperate file
# =============================================================================
[include mainsail.cfg] 

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXX-if00
serial: /dev/serial0
baud: 250000
restart_method: command

# -----------------------------------------------------------------------------
# Printer / Kinematics
# -----------------------------------------------------------------------------
[printer]
kinematics: polardrawing
max_velocity: 150
max_accel: 500

[force_move]
enable_force_move: True

# -----------------------------------------------------------------------------
# Polar Drawing kinematics parameters (Bigtreetech skr Pico)
#
# Only motor_distance and home_drop are required. Everything else below
# is auto-derived by polardrawing.py unless explicitly overridden here:
#
#   max_belt_length = sqrt((motor_distance/2)^2 + home_drop^2) - belt_safety_buffer
#   draw_margin_left = (motor_distance - draw_width) / 2        (draw_width < motor_distance)
#   min_belt_length = hypot(draw_margin_left, draw_margin_top) - min_belt_safety_buffer
#
# draw_margin_top and draw_width/draw_height are kept as explicit
# overrides here:
#   draw_margin_top  -- real hardware limit, how close the gondola can 
#                       mechanically get to the motor line.
#   draw_width/height -- the drawable area size.
# -----------------------------------------------------------------------------

[polardrawing]
motor_distance: 1007.0
home_drop: 1380.0
draw_margin_top:  200.0
draw_width:  650.0
draw_height: 950.0
homing_speed: 300

# -----------------------------------------------------------------------------
# Left stepper (uses physical endstop X-STOP)
# -----------------------------------------------------------------------------
[tmc2209 stepper_left]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.5
hold_current: 0.2
stealthchop_threshold: 999999

[stepper_left]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^!gpio4


# -----------------------------------------------------------------------------
# Right stepper (uses physical endstop Y-STOP)
# -----------------------------------------------------------------------------
[tmc2209 stepper_right]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.5
hold_current: 0.2
stealthchop_threshold: 999999

[stepper_right]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^!gpio3

# -----------------------------------------------------------------------------
# Pen lift servo
# -----------------------------------------------------------------------------
[servo pen_lift]
pin: gpio29
maximum_servo_angle: 180
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 90

[neopixel board_rgb]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

# -----------------------------------------------------------------------------
# Beeper (piezo, on the probe pin -- no probe fitted on this machine)
# -----------------------------------------------------------------------------
[output_pin beeper]
pin: gpio22
value: 0 
shutdown_value: 0
pwm: True
cycle_time: 0.0005   # 2 kHz default tone (1 / 0.0005 = 2000 Hz)

# -----------------------------------------------------------------------------
# Mainsail / Moonraker required sections
# -----------------------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[gcode_arcs]
resolution: 0.5

# =============================================================================
# G-CODE MACROS FOR DRAWING MACHINE
# =============================================================================

# -----------------------------------------------------------------------------
# CENTRAL PEN CONFIGURATION
# -----------------------------------------------------------------------------
[gcode_macro PEN_CFG]
description: Central configuration for pen servo angles
variable_up: 70.0
variable_down: 10.0
gcode:
    M118 Pen angles configured: UP={up}, DOWN={down}

# -----------------------------------------------------------------------------
# PEN CONTROL (smooth actuation to prevent gondola sway)
# -----------------------------------------------------------------------------
[gcode_macro PEN_UP]
description: Raise the pen smoothly based on PEN_CFG
gcode:
    {% set cfg = printer["gcode_macro PEN_CFG"] %}
    {% set u = cfg.up | float %}
    {% set d = cfg.down | float %}
    {% set diff = u - d %}
    SET_SERVO SERVO=pen_lift ANGLE={d + (diff * 0.2)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={d + (diff * 0.4)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={d + (diff * 0.6)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={d + (diff * 0.8)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={u}
    G4 P400

[gcode_macro PEN_DOWN]
description: Lower the pen onto the paper smoothly based on PEN_CFG
gcode:
    {% set cfg = printer["gcode_macro PEN_CFG"] %}
    {% set u = cfg.up | float %}
    {% set d = cfg.down | float %}
    {% set diff = d - u %}
    SET_SERVO SERVO=pen_lift ANGLE={u + (diff * 0.2)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={u + (diff * 0.4)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={u + (diff * 0.6)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={u + (diff * 0.8)}
    G4 P60
    SET_SERVO SERVO=pen_lift ANGLE={d}
    G4 P400

[gcode_macro PEN_OUT]
description: Compatibility alias -- the redesigned gondola only has UP/DOWN
gcode:
    PEN_UP

[gcode_macro CALIBRATE_PEN]
description: Test pen servo angles. Usage: CALIBRATE_PEN UP=95 DOWN=35
gcode:
    {% set cfg = printer["gcode_macro PEN_CFG"] %}
    {% set test_up = params.UP | default(cfg.up) | float %}
    {% set test_down = params.DOWN | default(cfg.down) | float %}
    M118 Testing PEN-UP: {test_up} degrees
    SET_SERVO SERVO=pen_lift ANGLE={test_up}
    G4 P2000
    M118 Testing PEN-DOWN: {test_down} degrees
    SET_SERVO SERVO=pen_lift ANGLE={test_down}
    G4 P2000
    SET_SERVO SERVO=pen_lift ANGLE={test_up}
    M118 Calibration test finished. Update [gcode_macro PEN_CFG] with optimal values.

[gcode_macro M280]
description: Servo control (Makelangelo compatibility: M280 P0 S90)
gcode:
    {% set angle = params.S | default(90) | float %}
    SET_SERVO SERVO=pen_lift ANGLE={angle}

# -----------------------------------------------------------------------------
# STATUS LED (Neopixel board_rgb)
# -----------------------------------------------------------------------------
[gcode_macro LED_IDLE]
description: White -- machine ready
gcode:
    SET_LED LED=board_rgb RED=0.3 GREEN=0.3 BLUE=0.3

[gcode_macro LED_DRAWING]
description: Blue -- plot in progress
gcode:
    SET_LED LED=board_rgb RED=0.0 GREEN=0.0 BLUE=1.0

[gcode_macro LED_PAUSED]
description: Yellow -- paused / pen swap
gcode:
    SET_LED LED=board_rgb RED=1.0 GREEN=0.6 BLUE=0.0

[gcode_macro LED_DONE]
description: Green -- plot finished
gcode:
    SET_LED LED=board_rgb RED=0.0 GREEN=1.0 BLUE=0.0

[gcode_macro LED_ERROR]
description: Red -- error / emergency stop
gcode:
    SET_LED LED=board_rgb RED=1.0 GREEN=0.0 BLUE=0.0

[gcode_macro LED_OFF]
description: LED off
gcode:
    SET_LED LED=board_rgb RED=0 GREEN=0 BLUE=0

# -----------------------------------------------------------------------------
# BEEPER (piezo on [output_pin beeper], gpio22 -- printer.cfg)
# -----------------------------------------------------------------------------
[gcode_macro BEEP]
description: Sound the beeper. Params: I=count DUR=duration_ms FREQ=hz
gcode:
    {% set i    = params.I    | default(1)    | int   %}
    {% set dur  = params.DUR  | default(100)  | int   %}
    {% set freq = params.FREQ | default(2000) | int   %}
    {% for n in range(i) %}
        SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ (1.0 / freq) | round(6) }
        G4 P{dur}
        SET_PIN PIN=beeper VALUE=0
        G4 P{dur}
    {% endfor %}

[gcode_macro BEEP_START]
description: Three short beeps -- plot starting
gcode:
    BEEP I=3 DUR=80 FREQ=2000

[gcode_macro BEEP_DONE]
description: Two long rising beeps -- plot complete
gcode:
    BEEP I=1 DUR=300 FREQ=1500
    G4 P100
    BEEP I=1 DUR=400 FREQ=2500

[gcode_macro BEEP_ERROR]
description: Five rapid low beeps -- error or emergency
gcode:
    BEEP I=5 DUR=100 FREQ=800

[gcode_macro BEEP_PEN_CHANGE]
description: Two short beeps -- pen change prompt
gcode:
    BEEP I=2 DUR=150 FREQ=3000

# -----------------------------------------------------------------------------
# MOVEMENT & HOMING
# -----------------------------------------------------------------------------
[gcode_macro G28]
description: Home both belt motors, then clear the endstops minimally
rename_existing: G28.1
gcode:
    PEN_UP
    G28.1
    G0 X{printer['polardrawing'].homed_drawing_x} Y{printer['polardrawing'].homed_drawing_y - 30} F2000

[gcode_macro START_PRINT]
description: Prepare plot, home and dynamically set origin to center
gcode:
    G90 ; Clear any lingering relative state immediately
    BEEP_START
    LED_OFF
    G28

    # Read workspace dimensions dynamically from printer.cfg
    {% set width = printer.configfile.settings['polardrawing'].draw_width | float %}
    {% set height = printer.configfile.settings['polardrawing'].draw_height | float %}

    # Shift the G-code origin exactly to the calculated center
    SET_GCODE_OFFSET X={width / 2.0} Y={height / 2.0}

    # Move to the new center (which is now X0 Y0)
    G0 X0 Y0 F4000
    
    # 🛑 CRITICAL: Halt the look-ahead planner here. 
    # Force the machine to be dead still before touching LEDs.
    M400 

    # Synchronized 5-second LED countdown cycle
    LED_DONE
    G4 S1
    M400
    
    LED_PAUSED
    G4 S1
    M400
    
    LED_IDLE
    G4 S1
    M400
    
    LED_ERROR
    G4 S1
    M400
    
    LED_DRAWING
    M400 ; Lock in the drawing state LED before handing control to the file

[gcode_macro END_PRINT]
description: Called at the end of every plot
gcode:
    # 🛑 CRITICAL: Make sure the final print stroke finishes completely
    M400 
    PEN_UP
    M400
    
    # Force Absolute Positioning and clear offset cleanly
    G90 
    SET_GCODE_OFFSET X=0 Y=0
    M400
    
    # Safely go back to absolute machine zero
	G0 X0 Y0 F4000
    M400
    
    # Signal completion
    LED_DONE
    BEEP_DONE

[gcode_macro CANCEL_PRINT]
description: Safely cancel the current plot and reset state
rename_existing: BASE_CANCEL_PRINT
gcode:
    PEN_UP
    LED_ERROR
    SET_GCODE_OFFSET X=0 Y=0
    GO_HOME
    # M18
    M118 Plot cancelled -- offset reset.
    BASE_CANCEL_PRINT

# -----------------------------------------------------------------------------
# PAUSE & PEN SWAP HANDLING
# -----------------------------------------------------------------------------
[gcode_macro PAUSE]
description: Pause the current plot in place
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    PEN_UP
    LED_PAUSED
    M118 Plot paused in place.

[gcode_macro M600]
description: Standard color change command (hooks into CHANGE_PEN)
gcode:
    CHANGE_PEN

[gcode_macro _PEN_STATE]
description: Internal flag tracking whether a pen swap is pending
variable_change_pending: 0
gcode:
    # State storage only -- never called directly

[gcode_macro CHANGE_PEN]
description: Pause the plot, lift the pen, and wait for confirmation
gcode:
    SET_GCODE_VARIABLE MACRO=_PEN_STATE VARIABLE=change_pending VALUE=1
    BASE_PAUSE
    PEN_UP
    LED_PAUSED
    G0 X0 Y0 F3000
    BEEP_PEN_CHANGE
    M118 Pen swap requested -- change the pen, then press Resume/Play.

[gcode_macro RESUME]
description: Resume the plot -- handles normal pauses and pen changes automatically
rename_existing: BASE_RESUME
gcode:
    {% set pending = printer["gcode_macro _PEN_STATE"].change_pending %}
    {% if pending %}
        PEN_UP
        SET_GCODE_VARIABLE MACRO=_PEN_STATE VARIABLE=change_pending VALUE=0
    {% else %}
        PEN_DOWN
    {% endif %}
    LED_DRAWING
    BASE_RESUME
    M118 Resuming plot.

# -----------------------------------------------------------------------------
# UTILITIES
# -----------------------------------------------------------------------------
[gcode_macro M18]
description: Disable stepper motors
rename_existing: M18.1
gcode:
    M18.1
    M118 Stepper motors disabled.
    
[gcode_macro POLARDRAWING_INFO]
description: Print machine geometry and state to the console
gcode:
    {% set width = printer.configfile.settings['polardrawing'].draw_width | float %}
    {% set height = printer.configfile.settings['polardrawing'].draw_height | float %}
    {% set distance = printer.configfile.settings['polardrawing'].motor_distance | float %}
    {% set drop = printer.configfile.settings['polardrawing'].home_drop | float %}

	
    M118 === Polar Drawing Machine ===
    M118 Configured drawing area: {width} x {height} mm
    M118 Motor distance:          {distance} mm
    M118 Home drop:               {drop} mm

