# =============================================================================
# polardrawing -- printer.cfg for Polar Drawing Machine with RUMBA board
# Project: https://github.com/captFuture/makelangelo_klipper
# =============================================================================

# --- INCLUDES (Hier werden deine aufgeteilten Dateien geladen) ---
[include mainsail.cfg]
[include macros.cfg]
[include lcd.cfg]

# -----------------------------------------------------------------------------
# MCU -- RUMBA board via USB
# -----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Arduino__www.arduino.cc__0042_75430333237351A03202-if00
baud: 250000

# -----------------------------------------------------------------------------
# Printer / Kinematics
# -----------------------------------------------------------------------------
[printer]
kinematics: polardrawing
max_velocity: 150
max_accel: 400

[force_move]
enable_force_move: True

# -----------------------------------------------------------------------------
# Polar Drawing kinematics parameters (Kalibriert: 500x700 mm)
# -----------------------------------------------------------------------------
[polardrawing]
motor_distance: 640.0
hypotenuse_length_at_home: 1043.7
max_belt_length: 1450.0
min_belt_length: 100.0
draw_margin_left: 70.0
draw_margin_top:  160.0
draw_width:  500.0
draw_height: 700.0
homing_speed: 50

# -----------------------------------------------------------------------------
# Left stepper
# -----------------------------------------------------------------------------
[stepper_left]
step_pin:   PH0
dir_pin:    !PH1
enable_pin: !PL1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^!PC1

# -----------------------------------------------------------------------------
# Right stepper
# -----------------------------------------------------------------------------
[stepper_right]
step_pin:   PF0
dir_pin:    !PL2
enable_pin: !PF1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^!PC3

# -----------------------------------------------------------------------------
# Pen lift servo
# -----------------------------------------------------------------------------
[servo pen_lift]
pin: PE3
maximum_servo_angle: 180
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 90

# -----------------------------------------------------------------------------
# Mainsail / Moonraker required sections
# -----------------------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[gcode_arcs]
resolution: 0.5